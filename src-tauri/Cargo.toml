[package]
name = "smis-testing"
version = "0.1.0"
description = "Локальное десктоп-приложение для тестирования студентов кафедры СМИС БНТУ"
authors = ["Даниил Нежевец"]
edition = "2021"

[lib]
name = "smis_testing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio", "migrate"] }
tokio = { version = "1", features = ["full"] }
dirs = "5.0"
log = "0.4"
env_logger = "0.10"
argon2 = "0.5"
calamine = "0.26.1"
zip = "=2.2.0" # Фиксируем версию zip, чтобы избежать конфликта API с calamine
tauri-plugin-dialog = "2"
password-hash = { version = "0.5", features = ["rand_core"] }
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
